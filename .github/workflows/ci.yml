name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: CI-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Scaffold and apply into a sandboxed home
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          node cli/bin/tackroom.mjs init "$RUNNER_TEMP/agents" --yes
          node cli/bin/tackroom.mjs doctor "$RUNNER_TEMP/agents"
          test -f "$HOME/.claude/CLAUDE.md"
          test -f "$HOME/.codex/AGENTS.md"
          test -f "$HOME/.config/opencode/AGENTS.md"
          test -f "$HOME/.claude/settings.json"
          test -f "$HOME/.codex/hooks.json"
          test -f "$HOME/.config/opencode/plugins/rulesync-hooks.js"
